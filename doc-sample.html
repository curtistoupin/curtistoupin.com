<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #sidebar {
            width: 325px;
            min-width: 325px;
            max-width: 325px;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            background-color: #f8f9fa;
            flex-shrink: 0;
            padding: 15px;
        }
        #main-panel {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fff;
            border-left: 1px solid #ddd;
        }
        .accordion-item {
            border: none;
        }
        .accordion-button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            margin: 5px 0;
        }
        .accordion-button:not(.collapsed) {
            background-color: #0056b3;
        }
        .accordion-body a {
            display: block;
            padding: 5px 10px;
            text-decoration: none;
            color: #333;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .accordion-body a:hover {
            background-color: #ddd;
        }
        .content-container {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.5;
        }
        /* Apply styles only to tables inside sections and subsections */
        #main-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        /* Add dark grey borders to all table cells */
        #main-panel th, 
        #main-panel td {
            border: 2px solid #444;
            padding: 8px;
            text-align: left;
        }

        /* Dark green background with white text for headers */
        #main-panel th {
            background-color: #225522;
            color: white;
            font-weight: bold;
        }

        /* Alternating row colors for better readability */
        #main-panel tr:nth-child(even) {
            background-color: #f2f2f2; /* Soft grey background */
        }

        /* Ensure headers are visually distinct even if they appear mid-table */
        #main-panel thead th {
            background-color: #225522;
            color: white;
        }

    </style>
</head>
<body>
    <div id="sidebar">
        <h4>Document Sections</h4>
        <input type="file" id="docxUpload" accept=".docx" class="form-control mb-3">
        <div id="sidebarAccordion" class="accordion"></div>
    </div>
    <div id="main-panel">
        <h2>Welcome!</h2>
        <p>Upload a DOCX file to view its content.</p>
    </div>
    
    <script>
        document.getElementById('docxUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = function(event) {
                    const arrayBuffer = reader.result;
                    mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                        .then(function(result) {
                            processAndResizeDocument(result.value);
                        })
                        .catch(function(err) {
                            console.error("Error parsing document:", err);
                        });
                };
            }
        });
    
        function processAndResizeDocument(htmlContent) {
            const sidebar = document.getElementById('sidebarAccordion');
            sidebar.innerHTML = '';
    
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            const elements = Array.from(doc.body.children);
            
            let sections = {};
            let lastMajorSection = null;
            let lastSubSection = null;
            let currentContent = '';
            let preSectionContent = '';
            let foundFirstSection = false;
    
            function resizeBase64Image(base64Str, maxWidth, callback) {
                let img = new Image();
                img.src = base64Str;
                img.onload = function () {
                    let scaleFactor = maxWidth / img.width;
                    let newWidth = maxWidth;
                    let newHeight = img.height * scaleFactor;
    
                    let canvas = document.createElement("canvas");
                    canvas.width = newWidth;
                    canvas.height = newHeight;
                    let ctx = canvas.getContext("2d");
    
                    ctx.drawImage(img, 0, 0, newWidth, newHeight);
    
                    let resizedBase64 = canvas.toDataURL("image/png"); // Convert back to base64
                    callback(resizedBase64);
                };
            }
    
            function replaceImage(el, callback) {
                let src = el.getAttribute("src");
                if (src.startsWith("data:image")) {
                    resizeBase64Image(src, 300, function(newBase64) {
                        el.setAttribute("src", newBase64);
                        callback(el);
                    });
                } else {
                    callback(el);
                }
            }
    
            let imagePromises = [];
    
            elements.forEach((el) => {
                if (el.tagName === 'IMG') {
                    let promise = new Promise((resolve) => {
                        replaceImage(el, function(resizedImage) {
                            currentContent += `<div style="text-align: center; margin: 15px 0;">${resizedImage.outerHTML}</div>`;
                            resolve();
                        });
                    });
                    imagePromises.push(promise);
                }
                else if (el.tagName === 'H1') {
                    if (!foundFirstSection) {
                        foundFirstSection = true;
                        document.getElementById('main-panel').innerHTML = `<div class='content-container'>${preSectionContent}</div>`;
                    }
                    if (lastMajorSection) {
                        if (lastSubSection) {
                            sections[lastMajorSection].subheaders[lastSubSection].content = currentContent;
                        } else {
                            sections[lastMajorSection].content = currentContent;
                        }
                    }
    
                    lastMajorSection = `section-${el.textContent.replace(/\s+/g, '-')}`;
                    sections[lastMajorSection] = {
                        title: el.textContent.trim(),
                        content: '',
                        subheaders: {}
                    };
                    lastSubSection = null;
                    currentContent = '';
                } else if (el.tagName === 'H2' && lastMajorSection) {
                    if (lastSubSection) {
                        sections[lastMajorSection].subheaders[lastSubSection].content = currentContent;
                    } else {
                        sections[lastMajorSection].content = currentContent;
                    }
                    lastSubSection = `subsection-${el.textContent.replace(/\s+/g, '-')}`;
                    sections[lastMajorSection].subheaders[lastSubSection] = {
                        title: el.textContent.trim(),
                        content: ''
                    };
                    currentContent = '';
                } else {
                    if (!foundFirstSection) {
                        preSectionContent += el.outerHTML;
                    } else {
                        currentContent += el.outerHTML;
                    }
                }
            });
    
            Promise.all(imagePromises).then(() => {
                if (lastMajorSection) {
                    if (lastSubSection) {
                        sections[lastMajorSection].subheaders[lastSubSection].content = currentContent;
                    } else {
                        sections[lastMajorSection].content = currentContent;
                    }
                }
    
                Object.keys(sections).forEach((key, index) => {
                    const section = sections[key];
                    const sectionId = `collapse-${index}`;
    
                    const accordionItem = document.createElement('div');
                    accordionItem.classList.add('accordion-item');
                    accordionItem.innerHTML = `
                        <h2 class="accordion-header" id="heading-${index}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${sectionId}" aria-expanded="false" aria-controls="${sectionId}">
                                ${section.title}
                            </button>
                        </h2>
                        <div id="${sectionId}" class="accordion-collapse collapse" aria-labelledby="heading-${index}" data-bs-parent="#sidebarAccordion">
                            <div class="accordion-body">
                                ${Object.keys(section.subheaders).length > 0 
                                    ? Object.values(section.subheaders).map(sub => `<a class="content-link" data-content="${encodeURIComponent(sub.content)}">${sub.title}</a>`).join('')
                                    : `<a class="content-link" data-content="${encodeURIComponent(section.content)}">View Content</a>`}
                            </div>
                        </div>
                    `;
                    sidebar.appendChild(accordionItem);
                });
            });
        }
    
        document.addEventListener("click", function(event) {
            if (event.target.classList.contains('content-link')) {
                event.preventDefault();
                document.getElementById('main-panel').innerHTML = `<div class='content-container'>${decodeURIComponent(event.target.getAttribute('data-content'))}</div>`;
            }
        });
    </script>
    
</body>
</html>
